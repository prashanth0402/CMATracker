name: cma_tracker
description: "Offline-first CMA Intermediate Group 1 Study & Timesheet Tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local database
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # Navigation
  go_router: ^14.6.2

  # Lightweight preferences
  shared_preferences: ^2.3.3

  # Notifications / reminders
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Export / import
  csv: ^6.0.0
  file_picker: ^8.1.6
  share_plus: ^10.1.2

  # Ads
  google_mobile_ads: ^5.3.0

  # Date / number formatting
  intl: ^0.20.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.23.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
